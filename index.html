<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Speaking Vocabulary Booster | Ensieh Safariyan</title>
<style>
:root {
  --navy:#102b4e;
  --blue:#244d7c;
  --lav:#e8e1fb;
  --purple:#7462bd;
  --mint:#d8f3e8;
  --ink:#162b46;
  --paper:#fbfaf8;
}
*{box-sizing:border-box}
body{
  margin:0;background:#eef2f8;color:var(--ink);
  font-family:Inter,"Segoe UI",Arial,sans-serif
}
button{font:inherit;cursor:pointer}
.app{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;padding:22px 16px 14px
}
.topbar{
  width:min(1100px,100%);display:flex;justify-content:space-between;
  align-items:center;gap:14px;margin-bottom:14px
}
.brand{
  font-weight:800;letter-spacing:.02em;color:var(--navy);
  font-size:clamp(15px,2vw,21px)
}
.counter{
  background:var(--lav);color:var(--navy);
  padding:9px 16px;border-radius:30px;font-weight:800
}
.stage{
  width:min(1100px,100%);flex:1;display:flex;
  align-items:center;justify-content:center
}
.slide{
  width:100%;min-height:min(690px,calc(100vh - 160px));
  background:var(--paper);border-radius:28px;overflow:hidden;
  box-shadow:0 18px 55px #17365b1b;
  display:grid;grid-template-columns:1.05fr .95fr;
  border:1px solid #e1e7f0
}
.copy{
  padding:clamp(24px,4vw,52px);display:flex;
  flex-direction:column;justify-content:center
}
.kicker{
  display:inline-flex;align-self:flex-start;
  background:var(--lav);color:var(--navy);
  padding:9px 15px;border-radius:24px;font-size:13px;
  font-weight:800;letter-spacing:.08em;text-transform:uppercase
}
h1{
  font-size:clamp(29px,4.3vw,52px);line-height:1.08;
  color:var(--navy);margin:22px 0 24px;letter-spacing:-.035em
}
.section{margin:0 0 20px}
.label{
  font-size:13px;text-transform:uppercase;letter-spacing:.1em;
  font-weight:800;color:var(--purple);margin-bottom:7px
}
.meaning{
  font-size:clamp(17px,2vw,21px);line-height:1.5;margin:0
}
.example{
  font-size:clamp(17px,2vw,21px);line-height:1.6;margin:0;
  background:#e9f7f1;border-left:5px solid #8acdb6;
  padding:15px 17px;border-radius:0 15px 15px 0
}
.example strong{color:#5140a5}
.tip{font-size:15px;line-height:1.5;color:#52647a;margin:0}
.visual{
  position:relative;min-height:420px;
  background:linear-gradient(145deg,#dfeafa,#e9e2fa);overflow:hidden
}
.visual img{
  width:100%;height:100%;position:absolute;inset:0;object-fit:cover
}
.visual:after{
  content:"";position:absolute;inset:45% 0 0;
  background:linear-gradient(transparent,#0c2449a8)
}
.photo-tag{
  position:absolute;z-index:1;bottom:24px;left:24px;right:24px;
  color:#fff;font-weight:750;font-size:clamp(18px,2vw,25px);
  line-height:1.25;text-shadow:0 2px 10px #0007
}
.footer{
  grid-column:1/-1;background:#eeebfa;color:var(--navy);
  display:flex;justify-content:center;align-items:center;gap:16px;
  padding:17px 20px;font-family:Georgia,serif;
  font-style:italic;font-weight:700;font-size:clamp(15px,2vw,20px)
}
.footer:before,.footer:after{
  content:"";height:1px;width:12%;background:#8e83c7
}
.nav{
  width:min(1100px,100%);display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding-top:15px
}
.nav button{
  border:0;border-radius:14px;padding:12px 20px;
  font-weight:800;background:var(--navy);color:white
}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.dots{
  display:flex;gap:5px;align-items:center;justify-content:center;
  flex-wrap:wrap;max-width:55%
}
.dot{width:7px;height:7px;border-radius:50%;background:#c5ccda;border:0;padding:0}
.dot.active{background:var(--purple);width:21px;border-radius:8px}
.hint{font-size:12px;color:#718096;text-align:center;margin-top:10px}
@media(max-width:720px){
  .app{padding:12px 10px}
  .slide{grid-template-columns:1fr;min-height:0}
  .copy{padding:25px 22px 20px;order:1}
  .visual{order:2;min-height:280px}
  .footer{order:3}
  h1{margin:17px 0}
  .section{margin-bottom:15px}
  .nav button{padding:11px 14px}
  .dots{max-width:40%}
}
@media print{
  body{background:#fff}
  .app{padding:0}
  .topbar,.nav,.hint{display:none!important}
  .stage{display:block;width:100%}
  .slide{
    display:grid!important;page-break-after:always;
    min-height:95vh;box-shadow:none;border-radius:0
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">IELTS SPEAKING · VOCABULARY BOOSTER</div>
    <div class="counter" id="counter">01 / 30</div>
  </div>

  <main class="stage">
    <article class="slide" aria-live="polite">
      <section class="copy">
        <div class="kicker" id="category">IDIOMS · 1 OF 10</div>
        <h1 id="expression">Strike a balance</h1>
        <div class="section">
          <div class="label">Meaning</div>
          <p class="meaning" id="meaning"></p>
        </div>
        <div class="section">
          <div class="label">Example</div>
          <p class="example" id="example"></p>
        </div>
        <div class="section">
          <div class="label">IELTS Speaking Tip</div>
          <p class="tip" id="tip"></p>
        </div>
      </section>
      <section class="visual">
        <img id="photo" alt="Related photo">
        <div class="photo-tag" id="photoTag"></div>
      </section>
      <footer class="footer">Instructor: Ensieh Safariyan</footer>
    </article>
  </main>

  <div class="nav">
    <button id="prev" type="button">← Previous</button>
    <div class="dots" id="dots" aria-label="Choose slide"></div>
    <button id="next" type="button">Next →</button>
  </div>
  <div class="hint">Use ← → arrow keys to navigate · Press Ctrl/Cmd + P to print</div>
</div>

<script>
const slides = [
{cat:"IDIOMS",word:"Strike a balance",meaning:"To manage different parts of life successfully without neglecting any of them.",example:"I try to <strong>strike a balance</strong> between my professional responsibilities and my personal life.",tip:"Useful for work–life balance, health and priorities.",tag:"Work · Life · Balance",img:"photo-1499750310107-5fef28a66643"},
{cat:"IDIOMS",word:"Recharge my batteries",meaning:"To rest and regain your energy.",example:"At the weekend, I read a book or go for a walk to <strong>recharge my batteries</strong>.",tip:"Useful for free time, weekends and holidays.",tag:"Take a break and recharge",img:"photo-1441974231531-c6227db76b6e"},
{cat:"IDIOMS",word:"Step out of my comfort zone",meaning:"To do something unfamiliar that challenges you.",example:"Taking on a leadership role encouraged me to <strong>step out of my comfort zone</strong>.",tip:"Ideal for challenges, achievements and personal growth.",tag:"Try something new",img:"photo-1521737711867-e3b97375f902"},
{cat:"IDIOMS",word:"Have a whale of a time",meaning:"To have a very enjoyable time. Informal.",example:"We had <strong>a whale of a time</strong> exploring the city during our holiday.",tip:"Best for travel, celebrations and enjoyable experiences.",tag:"A truly great time",img:"photo-1530789253388-582c481c54b0"},
{cat:"IDIOMS",word:"Weigh the pros and cons",meaning:"To consider the advantages and disadvantages before deciding.",example:"Before changing jobs, I carefully <strong>weighed the pros and cons</strong>.",tip:"Useful for decisions, careers and technology.",tag:"Make an informed decision",img:"photo-1454165804606-c3d57bc86b40"},
{cat:"IDIOMS",word:"Learn the ropes",meaning:"To learn how a job, task or activity is done.",example:"It took me a few weeks to <strong>learn the ropes</strong> at my new workplace.",tip:"Useful for starting a job or learning a new skill.",tag:"Getting used to a new role",img:"photo-1521737711867-e3b97375f902"},
{cat:"IDIOMS",word:"Go the extra mile",meaning:"To make more effort than is expected.",example:"A good teacher often <strong>goes the extra mile</strong> to support struggling students.",tip:"Useful for work ethic, education and relationships.",tag:"Make an extra effort",img:"photo-1522202176988-66273c2fd55f"},
{cat:"IDIOMS",word:"Keep my cool",meaning:"To remain calm in a stressful situation.",example:"I try to <strong>keep my cool</strong> when several deadlines fall in the same week.",tip:"Useful for stress, conflict and challenging situations.",tag:"Stay calm under pressure",img:"photo-1506126613408-eca07ce68773"},
{cat:"IDIOMS",word:"See eye to eye",meaning:"To agree with someone about something.",example:"My colleagues and I don't always <strong>see eye to eye</strong>, but we respect each other's opinions.",tip:"Useful for friends, family, teamwork and disagreement.",tag:"Agree or disagree respectfully",img:"photo-1529156069898-49953e39b3ac"},
{cat:"IDIOMS",word:"A blessing in disguise",meaning:"Something that seems bad at first but later brings a good result.",example:"Missing that opportunity was <strong>a blessing in disguise</strong> because it led me to a better job.",tip:"Useful for setbacks, changes and unexpected outcomes.",tag:"A setback that led to something good",img:"photo-1500530855697-b586d89ba3ee"},

{cat:"SIMILES",word:"As busy as a bee",meaning:"Extremely busy and active.",example:"During exam week, I was <strong>as busy as a bee</strong> preparing lessons and marking assignments.",tip:"Use to describe a hectic day or period.",tag:"A packed schedule",img:"photo-1499750310107-5fef28a66643"},
{cat:"SIMILES",word:"As light as a feather",meaning:"Extremely light in weight.",example:"My new laptop is <strong>as light as a feather</strong>, so I can carry it to work easily.",tip:"Useful for describing objects, bags and technology.",tag:"Light and easy to carry",img:"photo-1498050108023-c5249f4df085"},
{cat:"SIMILES",word:"As cool as a cucumber",meaning:"Very calm, especially in a stressful situation.",example:"Although the interview was challenging, she stayed <strong>as cool as a cucumber</strong>.",tip:"Describe someone who handles pressure well.",tag:"Calm under pressure",img:"photo-1470252649378-9c29740c9fa8"},
{cat:"SIMILES",word:"As stubborn as a mule",meaning:"Very unwilling to change your opinion or behaviour.",example:"My younger brother can be <strong>as stubborn as a mule</strong> when he thinks he is right.",tip:"Use carefully; it can sound critical or teasing.",tag:"Refusing to change your mind",img:"photo-1546445317-29f4545e9d53"},
{cat:"SIMILES",word:"As clear as crystal",meaning:"Extremely clear and easy to understand.",example:"The instructor's explanation was <strong>as clear as crystal</strong>.",tip:"Useful for explanations and communication.",tag:"Crystal-clear explanation",img:"photo-1455390582262-044cdead277a"},
{cat:"SIMILES",word:"Like a fish out of water",meaning:"Feeling uncomfortable in an unfamiliar situation.",example:"I felt <strong>like a fish out of water</strong> at my first international conference.",tip:"Useful for new environments and first-time experiences.",tag:"In an unfamiliar situation",img:"photo-1516321318423-f06f85e504b3"},
{cat:"SIMILES",word:"Like two peas in a pod",meaning:"Very similar or extremely close to one another.",example:"My best friend and I are <strong>like two peas in a pod</strong>; we enjoy the same activities.",tip:"Use for close friends or family members who are alike.",tag:"Two people who are very alike",img:"photo-1529156069898-49953e39b3ac"},
{cat:"SIMILES",word:"Spread like wildfire",meaning:"To spread very quickly among people.",example:"The news about the new course <strong>spread like wildfire</strong> on social media.",tip:"Useful for technology, trends and news.",tag:"News travels fast",img:"photo-1516321318423-f06f85e504b3"},
{cat:"SIMILES",word:"Like a breath of fresh air",meaning:"Refreshing, different and welcome.",example:"The new manager was <strong>like a breath of fresh air</strong> because she encouraged creative ideas.",tip:"Use to describe a positive person, place or change.",tag:"A refreshing change",img:"photo-1470252649378-9c29740c9fa8"},
{cat:"SIMILES",word:"As fresh as a daisy",meaning:"Looking or feeling fresh, energetic and well-rested.",example:"After a full night's sleep, I felt <strong>as fresh as a daisy</strong>.",tip:"Useful for sleep, rest and energy.",tag:"Rested and full of energy",img:"photo-1490750967868-88aa4486c946"},

{cat:"ANIMAL VERBS",word:"Horse around",meaning:"To play noisily or behave in a silly way.",example:"The students were <strong>horsing around</strong> instead of preparing for the presentation.",tip:"Informal; describes playful or disruptive behaviour.",tag:"Playing around instead of working",img:"photo-1553284965-83fd3e82fa5a"},
{cat:"ANIMAL VERBS",word:"Badger someone",meaning:"To repeatedly ask or pressure someone to do something.",example:"My colleagues kept <strong>badgering me</strong> with questions while I was finishing a report.",tip:"Often negative; useful for describing persistent pressure.",tag:"Repeated questions and pressure",img:"photo-1521737711867-e3b97375f902"},
{cat:"ANIMAL VERBS",word:"Monkey around",meaning:"To waste time or behave playfully instead of doing something serious.",example:"If we keep <strong>monkeying around</strong>, we won't finish the project on time.",tip:"Informal and common in everyday conversation.",tag:"Stop wasting time",img:"photo-1522202176988-66273c2fd55f"},
{cat:"ANIMAL VERBS",word:"Wolf down",meaning:"To eat something very quickly.",example:"I <strong>wolfed down</strong> my lunch because I had to teach another class five minutes later.",tip:"Informal; useful for talking about being in a hurry.",tag:"Eating in a hurry",img:"photo-1547592180-85f173990554"},
{cat:"ANIMAL VERBS",word:"Hawk something",meaning:"To sell or promote something aggressively.",example:"Some online influencers <strong>hawk</strong> products without explaining their limitations.",tip:"Useful for advertising, consumerism and social media.",tag:"Aggressive selling and promotion",img:"photo-1556742049-0cfed4f6a45d"},
{cat:"ANIMAL VERBS",word:"Parrot something",meaning:"To repeat words without necessarily understanding them.",example:"Students should analyse ideas rather than simply <strong>parrot</strong> what they read online.",tip:"Useful for education and critical thinking.",tag:"Repeat without understanding",img:"photo-1503676260728-1c00da094a0b"},
{cat:"ANIMAL VERBS",word:"Snake through",meaning:"To move along a winding or twisting route.",example:"A narrow road <strong>snakes through</strong> the mountains and connects several villages.",tip:"Useful for describing roads, rivers, paths and landscapes.",tag:"A winding route through nature",img:"photo-1464822759023-fed622ff2c3b"},
{cat:"ANIMAL VERBS",word:"Be dogged by",meaning:"To be affected by continuing problems or difficulties.",example:"The project was <strong>dogged by</strong> delays and budget problems.",tip:"A relatively formal expression for IELTS Part 3.",tag:"Persistent problems",img:"photo-1454165804606-c3d57bc86b40"},
{cat:"ANIMAL VERBS",word:"Catnap",meaning:"To take a short nap.",example:"After teaching four classes, I sometimes <strong>catnap</strong> for twenty minutes.",tip:"Informal; useful for routines, sleep and energy.",tag:"A short power nap",img:"photo-1511295742362-92c96b8f4a3a"},
{cat:"ANIMAL VERBS",word:"Pig out",meaning:"To eat a lot of food, often more than you need.",example:"On movie nights, we sometimes <strong>pig out</strong> on popcorn and pizza.",tip:"Informal; useful for food and leisure topics.",tag:"Eating lots of snacks",img:"photo-1579751626657-72bc17010498"}
];

let current=0;
const $=id=>document.getElementById(id);
function render(){
 const s=slides[current];
 $("category").textContent=`${s.cat} · ${(current%10)+1} OF 10`;
 $("expression").textContent=s.word;
 $("meaning").textContent=s.meaning;
 $("example").innerHTML=s.example;
 $("tip").textContent=s.tip;
 $("photoTag").textContent=s.tag;
 $("photo").src=`https://images.unsplash.com/${s.img}?auto=format&fit=crop&w=1200&q=85`;
 $("photo").alt=s.tag;
 $("counter").textContent=`${String(current+1).padStart(2,"0")} / ${slides.length}`;
 $("prev").disabled=current===0;
 $("next").disabled=current===slides.length-1;
 document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("active",i===current));
}
function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()}
$("prev").addEventListener("click",()=>go(current-1));
$("next").addEventListener("click",()=>go(current+1));
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")go(current+1);
 if(e.key==="ArrowLeft")go(current-1);
});
slides.forEach((s,i)=>{
 const b=document.createElement("button");
 b.className="dot";
 b.title=`Slide ${i+1}: ${s.word}`;
 b.setAttribute("aria-label",b.title);
 b.addEventListener("click",()=>go(i));
 $("dots").appendChild(b);
});
render();
</script>
</body>
</html>
